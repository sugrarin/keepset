name: Keepset
options:
  bundleIdPrefix: com.keepset
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "6.0"
  MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Keepset:
    type: application
    platform: macOS
    sources:
      - path: Keepset
        excludes:
          - "**/.DS_Store"
      - path: photos
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keepset.app
        PRODUCT_NAME: Keepset
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Keepset
        INFOPLIST_KEY_CFBundleName: Keepset
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Keepset keeps the photos you select and moves the rest to Recently Deleted.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Keepset/Keepset.entitlements
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_STRICT_CONCURRENCY: complete
    entitlements:
      path: Keepset/Keepset.entitlements
      properties:
        com.apple.security.personal-information.photos-library: true
    scheme:
      testTargets:
        - KeepsetTests
      environmentVariables:
        KEEPSET_PHOTOS_DIR: $(SRCROOT)/photos
  KeepsetTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KeepsetTests
    dependencies:
      - target: Keepset
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keepset.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        SWIFT_STRICT_CONCURRENCY: complete
